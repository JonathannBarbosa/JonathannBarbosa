7">Claude</text><text x="769.0" y="119.0" text-anchor="middle" font-size="13" fill="#8e8e93">claude.ai, Desktop, Code</text><rect x="674" y="170" width="190" height="70" rx="14" fill="#0b0b0c" stroke="#48484a" stroke-width="2"/><rect x="674" y="170" width="190" height="70" rx="14" fill="#f5f5f7" fill-opacity="0.07" stroke="#f5f5f7" stroke-width="2" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.6667" values="0;1"/></rect><text x="769.0" y="203.0" text-anchor="middle" font-size="19" font-weight="700" fill="#f5f5f7">Painel /core</text><text x="769.0" y="225.0" text-anchor="middle" font-size="13" fill="#8e8e93">sistema interno, Vercel</text><rect x="674" y="276" width="190" height="70" rx="14" fill="#0b0b0c" stroke="#48484a" stroke-width="2"/><rect x="674" y="276" width="190" height="70" rx="14" fill="#f5f5f7" fill-opacity="0.07" stroke="#f5f5f7" stroke-width="2" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.6667" values="0;1"/></rect><text x="769.0" y="309.0" text-anchor="middle" font-size="19" font-weight="700" fill="#f5f5f7">Supabase</text><text x="769.0" y="331.0" text-anchor="middle" font-size="13" fill="#8e8e93">dados da plataforma</text><circle r="5" fill="#ffffff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.3333" values="0;1;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1667;0.3083;1" path="M131 134 L131 164"/></circle><circle r="5" fill="#ffffff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.3333;0.5000" values="0;1;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3333;0.4750;1" path="M131 234 L131 264"/></circle><circle r="5" fill="#ffffff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.6667" values="0;1;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.6417;1" path="M226 299 L330 299"/></circle><circle r="5" fill="#ffffff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.6667;0.8333" values="0;1;0"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6667;0.8083;1" path="M674 112 L558 238 L558 286 L674 222 L769 240 L769 276"/></circle><circle r="5" fill="#ffffff" opacity="0"><animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.8333" values="0;1"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8333;0.9750;1" path="M674 86 L558 128 L558 176 L674 196 L769 240 L769 276"/></circle><text x="450" y="384" text-anchor="middle" font-size="15" fill="#d2d2d7" opacity="0">1. O código do servidor MCP fica no GitHub<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.1667" values="1;0"/></text><text x="450" y="384" text-anchor="middle" font-size="15" fill="#d2d2d7" opacity="0">2. O GitHub Actions automatiza a entrega<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.1667;0.3333" values="0;1;0"/></text><text x="450" y="384" text-anchor="middle" font-size="15" fill="#d2d2d7" opacity="0">3. O servidor é empacotado em imagem Docker<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.3333;0.5000" values="0;1;0"/></text><text x="450" y="384" text-anchor="middle" font-size="15" fill="#d2d2d7" opacity="0">4. As imagens sobem no Portainer: um servidor de dev e um de produção<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.6667" values="0;1;0"/></text><text x="450" y="384" text-anchor="middle" font-size="15" fill="#d2d2d7" opacity="0">5. O Claude usa o servidor de produção, que lê o painel na Vercel<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.6667;0.8333" values="0;1;0"/></text><text x="450" y="384" text-anchor="middle" font-size="15" fill="#d2d2d7" opacity="0">6. Em dev, o Claude usa o servidor de testes<animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.8333" values="0;1"/></text></svg>
